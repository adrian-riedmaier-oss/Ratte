name: Seite veröffentlichen

# Die Konsole ist eine reine statische Seite ohne Bauschritt — es wird
# unverändert ausgeliefert, was im Repository liegt. Dadurch ist die
# ausgelieferte data/shots.csv immer exakt die versionierte Messreihe.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft ein Deployment schon, wird es zu Ende gebracht statt abgebrochen —
# sonst könnte ein gerade gesicherter Schuss unveröffentlicht liegen bleiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement schaltet Pages beim ersten Lauf selbst frei, sofern es in den
      # Repository-Einstellungen noch nicht aktiv ist. Spart den Handgriff unter
      # Settings -> Pages; schlägt es fehl, dort einmal "GitHub Actions" als
      # Quelle wählen und den Lauf wiederholen.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
